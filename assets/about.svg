<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 820 454" width="820" height="454" role="img" aria-label="Aryan Singh, Backend Developer who builds the servers, APIs and databases behind apps">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;fill:#c9d1d9;white-space:pre}
.u{fill:#36bcf7}.h{fill:#7ee787}.g{fill:#6e7f8d}.y{fill:#e3b341}.f{fill:#7ee787}.w{fill:#fff;font-weight:700}
.o{opacity:0;animation:in .45s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.k{animation:b 1s step-end infinite}
@keyframes b{50%{opacity:0}}
</style>
<defs>
<clipPath id="r"><rect width="820" height="454" rx="14"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#172f3a"/></linearGradient>
<clipPath id="c0"><rect x="24" y="58" height="26" width="0"><animate attributeName="width" to="340" begin="0.4s" dur=".7s" fill="freeze"/></rect></clipPath>
<clipPath id="c1"><rect x="24" y="128" height="26" width="0"><animate attributeName="width" to="340" begin="2.0s" dur=".7s" fill="freeze"/></rect></clipPath>
<clipPath id="c2"><rect x="24" y="222" height="26" width="0"><animate attributeName="width" to="340" begin="3.9s" dur=".7s" fill="freeze"/></rect></clipPath>
<clipPath id="c3"><rect x="24" y="340" height="26" width="0"><animate attributeName="width" to="340" begin="5.9s" dur=".7s" fill="freeze"/></rect></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="820" height="454" fill="url(#bg)"/>
<rect width="820" height="40" fill="#0a161c"/>
<circle cx="24" cy="20" r="6" fill="#ff5f56"/><circle cx="44" cy="20" r="6" fill="#ffbd2e"/><circle cx="64" cy="20" r="6" fill="#27c93f"/>
<text x="410" y="25" text-anchor="middle" class="g" style="font-size:13px">aryan@backend: ~</text>
</g>
<text x="26" y="76" clip-path="url(#c0)"><tspan class="u">aryan</tspan><tspan class="g">@</tspan><tspan class="h">backend</tspan> <tspan class="y">~</tspan> <tspan class="g">$</tspan> whoami</text>
<text x="26" y="102" class="o" style="animation-delay:1.4s"><tspan class="w">Aryan Singh</tspan><tspan class="g">  ·  </tspan><tspan class="u">Backend Developer</tspan></text>
<text x="26" y="146" clip-path="url(#c1)"><tspan class="u">aryan</tspan><tspan class="g">@</tspan><tspan class="h">backend</tspan> <tspan class="y">~</tspan> <tspan class="g">$</tspan> cat about.txt</text>
<text x="26" y="172" class="o" style="animation-delay:3.0s"><tspan class="u">▸</tspan> I build the part of apps you never see: servers, APIs and databases</text>
<text x="26" y="196" class="o" style="animation-delay:3.2s"><tspan class="u">▸</tspan> If a button just works when you tap it, someone like me made it happen</text>
<text x="26" y="240" clip-path="url(#c2)"><tspan class="u">aryan</tspan><tspan class="g">@</tspan><tspan class="h">backend</tspan> <tspan class="y">~</tspan> <tspan class="g">$</tspan> cat fun-facts.txt</text>
<text x="26" y="266" class="o" style="animation-delay:4.8s"><tspan class="u">▸</tspan> I write tests so my bugs get caught before anyone else meets them</text>
<text x="26" y="290" class="o" style="animation-delay:5.1s"><tspan class="u">▸</tspan> Favourite HTTP status is 200 OK, but 500 and I know each other well</text>
<text x="26" y="314" class="o" style="animation-delay:5.3s"><tspan class="u">▸</tspan> Gojo fan, so naturally my code aims to be <tspan class="y">Limitless</tspan></text>
<text x="26" y="358" clip-path="url(#c3)"><tspan class="u">aryan</tspan><tspan class="g">@</tspan><tspan class="h">backend</tspan> <tspan class="y">~</tspan> <tspan class="g">$</tspan> ls ~/currently</text>
<text x="26" y="384" class="o" style="animation-delay:6.9s"><tspan class="f">building-cool-stuff/</tspan>   <tspan class="f">shipping-features/</tspan>   <tspan class="f">leveling-up-daily/</tspan></text>
<g class="o" style="animation-delay:7.5s"><text x="26" y="428"><tspan class="u">aryan</tspan><tspan class="g">@</tspan><tspan class="h">backend</tspan> <tspan class="y">~</tspan> <tspan class="g">$</tspan> <tspan class="k u">█</tspan></text></g>
<rect x=".5" y=".5" width="819" height="453" rx="14" fill="none" stroke="#2c5364"/>
</svg>
